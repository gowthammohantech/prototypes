<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elixir Books Smart Invoicing — Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1c5fa8; --navy-d:#16437a; --navy-dd:#0f2e57; --navy-ddd:#0a2140;
  --ink:#0f1b2d; --ink2:#344054; --muted:#667085; --muted2:#8a94a6;
  --line:#e6ebf2; --line2:#eff3f8;
  --bg:#f4f7fb; --card:#fff;
  --green:#0a8f5f; --greenbg:#e7f5ef;
  --amber:#a86400; --amberbg:#fdf3e3;
  --red:#c0392b; --redbg:#fbeceb;
  --violet:#7a3fd0; --violetbg:#f0eafb;
  --magenta:#c0398b; --magentabg:#fbeef2;
  --bluebg:#eef4fb;
  --rail:248px; --lixi:396px; --top:60px;
  --sh1:0 1px 2px rgba(16,24,40,.05);
  --sh2:0 4px 16px -6px rgba(16,24,40,.16);
  --sh3:0 24px 60px -18px rgba(11,25,48,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy);text-decoration:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfd8e4;border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b3c0d1;background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) 0;height:100vh;transition:grid-template-columns .22s cubic-bezier(.4,0,.2,1)}
.shell.lixi-open{grid-template-columns:var(--rail) minmax(0,1fr) var(--lixi)}
.shell.rail-collapsed{--rail:68px}

/* ---------- rail ---------- */
.rail{background:linear-gradient(178deg,#153a68 0%,#102c52 46%,#0b2143 100%);color:#dbe7f5;display:flex;flex-direction:column;overflow:hidden;position:relative}
.rail:after{content:'';position:absolute;inset:0 0 0 auto;width:1px;background:rgba(255,255,255,.07)}
.brand{display:flex;align-items:center;gap:11px;padding:16px 18px 14px;flex:none}
.brand-mark{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
.brand-mark i{width:15px;height:15px;border-radius:5px;background:linear-gradient(135deg,var(--navy),var(--green));display:block}
.brand-txt{min-width:0}
.brand-name{font-weight:800;font-size:15.5px;letter-spacing:-.015em;color:#fff;white-space:nowrap}
.brand-sub{font-size:9px;font-weight:800;letter-spacing:.24em;color:#7fa8d6;margin-top:1px}
.rail-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 10px 10px}
.rail-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);background-clip:content-box}
.navgroup{margin-top:14px}
.navlabel{font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#5d84b3;padding:0 10px 7px}
.navitem{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:#b9cde5;transition:background .13s,color .13s;position:relative;text-align:left}
.navitem:hover{background:rgba(255,255,255,.07);color:#fff}
.navitem.on{background:rgba(255,255,255,.13);color:#fff;font-weight:700}
.navitem.on:before{content:'';position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:#4ea3ef}
.navitem svg{flex:none;opacity:.9}
.navitem .lbl{flex:1;white-space:nowrap;overflow:hidden}
.navbadge{font-size:10px;font-weight:800;padding:1px 6px;border-radius:20px;background:#c2472f;color:#fff;line-height:1.5;font-family:'IBM Plex Mono',monospace}
.navbadge.q{background:rgba(255,255,255,.16);color:#cfe1f5}
.rail-foot{flex:none;padding:10px;border-top:1px solid rgba(255,255,255,.08)}
.bizcard{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;text-align:left;transition:background .13s}
.bizcard:hover{background:rgba(255,255,255,.07)}
.bizav{width:30px;height:30px;border-radius:8px;background:#2f6fb5;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.bizname{font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bizgst{font-size:10px;color:#7fa8d6;letter-spacing:.02em}
.shell.rail-collapsed .brand-txt,.shell.rail-collapsed .navlabel,.shell.rail-collapsed .lbl,
.shell.rail-collapsed .navbadge,.shell.rail-collapsed .bizname,.shell.rail-collapsed .bizgst{display:none}
.shell.rail-collapsed .navitem,.shell.rail-collapsed .bizcard{justify-content:center;padding:9px 0}
.shell.rail-collapsed .brand{justify-content:center;padding:16px 0 14px}

/* ---------- topbar ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.top{height:var(--top);flex:none;display:flex;align-items:center;gap:14px;padding:0 22px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:30}
.iconbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .13s,color .13s}
.iconbtn:hover{background:var(--line2);color:var(--ink2)}
.crumb{display:flex;align-items:baseline;gap:9px;min-width:0}
.crumb h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.crumb span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.searchbtn{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px 0 11px;border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--muted);font-size:13px;min-width:230px;transition:border-color .13s,box-shadow .13s}
.searchbtn:hover{border-color:#cfd9e6;box-shadow:var(--sh1)}
.kbd{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;color:var(--muted2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:#fbfcfe}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:700;border:1px solid transparent;transition:filter .13s,background .13s,border-color .13s;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn-p{background:var(--navy);color:#fff}.btn-p:hover:not(:disabled){background:#17518f}
.btn-g{background:var(--green);color:#fff}.btn-g:hover:not(:disabled){background:#088155}
.btn-o{background:#fff;color:var(--ink2);border-color:var(--line)}.btn-o:hover:not(:disabled){border-color:#cfd9e6;background:#fbfcfe}
.btn-d{background:#fff;color:var(--red);border-color:#f3c9c4}.btn-d:hover:not(:disabled){background:#fef6f5}
.btn-ghost{color:var(--navy)}.btn-ghost:hover{background:var(--bluebg)}
.btn-sm{height:29px;padding:0 10px;font-size:12.5px;border-radius:8px}
.avatar-btn{width:33px;height:33px;border-radius:50%;background:var(--bluebg);color:var(--navy);font-weight:800;font-size:13px;display:grid;place-items:center;border:1px solid #d6e4f5}
.lixi-toggle{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 10px;border-radius:9px;background:linear-gradient(135deg,#1c5fa8,#0f7a58);color:#fff;font-size:13.5px;font-weight:700}
.lixi-toggle:hover{filter:brightness(1.08)}
.lixi-toggle .dot{width:6px;height:6px;border-radius:50%;background:#7ef0bc;box-shadow:0 0 0 3px rgba(126,240,188,.25)}

/* ---------- page ---------- */
.page{flex:1;overflow-y:auto;padding:22px 22px 40px}
.page-inner{max-width:1320px;margin:0 auto}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted2)}
.sec{margin-top:22px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.sec-head h2{margin:0;font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh1)}
.card-head{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.card-head h3{margin:0;font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.card-body{padding:16px}
.grid{display:grid;gap:14px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px 14px;box-shadow:var(--sh1);position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,var(--navy))}
.kpi .lab{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2)}
.kpi .val{font-size:25px;font-weight:700;letter-spacing:-.035em;margin-top:7px;color:var(--ink)}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
.trend{font-size:11.5px;font-weight:800;padding:1px 6px;border-radius:5px}
.trend.up{background:var(--greenbg);color:var(--green)}
.trend.dn{background:var(--redbg);color:var(--red)}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;white-space:nowrap;position:sticky;top:0;z-index:2}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--ink2)}
.tbl th .arw{opacity:.4;margin-left:4px;font-size:9px}
.tbl th.act .arw{opacity:1;color:var(--navy)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:#f8fafd;cursor:pointer}
.tbl tbody tr.sel{background:var(--bluebg)}
.tbl tbody tr:last-child td{border-bottom:none}
.r{text-align:right}.c{text-align:center}
.money{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
.docno{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:var(--ink2);letter-spacing:-.02em;white-space:nowrap}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.who .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sb{font-size:11.5px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:6px;white-space:nowrap;text-transform:uppercase}
.pill.soft{background:var(--line2);color:var(--muted2)}
.strip{display:inline-flex;gap:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink2);transition:all .12s}
.chip:hover{border-color:#cfd9e6}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.75}
.chip.on .n{opacity:.85}
.srch{display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:250px}
.srch input{border:none;outline:none;background:none;width:100%;font-size:13.5px}
.srch input::placeholder{color:var(--muted2)}
.checkbox{width:16px;height:16px;border-radius:4px;border:1.5px solid #c3ccd8;display:grid;place-items:center;background:#fff;flex:none;transition:all .12s}
.checkbox.on{background:var(--navy);border-color:var(--navy)}
.bulkbar{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--bluebg);border-bottom:1px solid #d6e4f5;font-size:13px;font-weight:600;color:var(--navy-d)}
.empty{padding:52px 20px;text-align:center}
.empty .ttl{font-weight:800;font-size:15px;margin-bottom:5px}
.empty .msg{color:var(--muted);font-size:13.5px;margin-bottom:16px;max-width:380px;margin-left:auto;margin-right:auto}
/* ---------- worklist / compliance queue ---------- */
.queue{display:flex;flex-direction:column}
.qrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);transition:background .1s}
.qrow:last-child{border-bottom:none}
.qrow:hover{background:#f8fafd}
.qico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.qmain{flex:1;min-width:0}
.qttl{font-weight:700;font-size:13.5px}
.qsub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- bars ---------- */
.barrow{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:12px;margin-bottom:11px}
.barrow:last-child{margin-bottom:0}
.barlab{font-size:12px;font-weight:700;color:var(--ink2)}
.bartrack{height:9px;border-radius:20px;background:var(--line2);overflow:hidden}
.barfill{height:100%;border-radius:20px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.barval{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,22,40,.42);backdrop-filter:blur(2px);z-index:60}
.scrim.is-new{animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,92vw);background:#fff;z-index:61;display:flex;flex-direction:column;box-shadow:var(--sh3)}
.drawer.is-new{animation:slidein .26s cubic-bezier(.32,.72,0,1)}
@keyframes slidein{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
.dr-head{flex:none;padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px}
.dr-body{flex:1;overflow-y:auto;padding:20px;background:#fbfcfe}
.dr-foot{flex:none;padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;background:#fff}
.dr-title{font-size:17px;font-weight:800;letter-spacing:-.02em}

/* ---------- doc / invoice paper ---------- */
.paper{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--sh1)}
.paper-head{padding:18px 20px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.pl{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted2);margin-bottom:3px}
.pv{font-weight:600}
.lines{width:100%;border-collapse:collapse}
.lines th{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);padding:8px 20px;text-align:left;background:#fbfcfe;border-bottom:1px solid var(--line2)}
.lines td{padding:11px 20px;border-bottom:1px solid var(--line2);font-size:13.5px}
.lines tr:last-child td{border-bottom:none}
.totals{padding:14px 20px;background:#fbfcfe;border-top:1px solid var(--line2)}
.trow{display:flex;justify-content:space-between;gap:20px;padding:4px 0;font-size:13.5px;color:var(--ink2)}
.trow.grand{border-top:1px solid var(--line);margin-top:8px;padding-top:11px;font-size:16px;font-weight:800;color:var(--ink)}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tlrow{position:relative;padding-bottom:14px}
.tlrow:last-child{padding-bottom:0}
.tldot{position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px currentColor}
.tlttl{font-size:13px;font-weight:700}
.tltime{font-size:11.5px;color:var(--muted2)}

/* ---------- modal ---------- */
.modal{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;box-shadow:var(--sh3);width:min(940px,94vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal.is-new{animation:pop .2s cubic-bezier(.32,.72,0,1)}
.modal.sm{width:min(460px,94vw)}
.modal.md{width:min(620px,94vw)}
@keyframes pop{from{transform:translate(-50%,-48%) scale(.97);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.md-head{flex:none;padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px}
.md-body{flex:1;overflow-y:auto;padding:20px}
.md-foot{flex:none;padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;background:#fbfcfe}

/* forms */
.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.inp{width:100%;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;font-size:14px;transition:border-color .13s,box-shadow .13s}
.inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(28,95,168,.13)}
.inp.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.1)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;min-height:70px;line-height:1.5}
.hint{font-size:11.5px;color:var(--muted2);margin-top:5px}
.hint.err{color:var(--red);font-weight:600}
.segs{display:flex;gap:7px;flex-wrap:wrap}
.seg{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink2);transition:all .12s}
.seg:hover{border-color:#cfd9e6}
.seg.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg.on.g{background:var(--green);border-color:var(--green)}
.seg.on.m{background:var(--magenta);border-color:var(--magenta)}
.picker{border:1px solid var(--line);border-radius:11px;max-height:250px;overflow-y:auto;background:#fff}
.pickrow{display:flex;align-items:center;gap:11px;width:100%;padding:10px 13px;border-bottom:1px solid var(--line2);text-align:left;transition:background .1s}
.pickrow:last-child{border-bottom:none}
.pickrow:hover{background:#f8fafd}
.pickrow.on{background:var(--bluebg)}
.pickrow .nm{font-weight:600;font-size:13.5px}
.pickrow .sb{font-size:11.5px;color:var(--muted2)}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid #c3ccd8;display:grid;place-items:center;flex:none}
.radio.on{border-color:var(--navy)}
.radio.on i{width:8px;height:8px;border-radius:50%;background:var(--navy);display:block}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.qty button{width:27px;height:27px;display:grid;place-items:center;color:var(--ink2);font-weight:700;transition:background .1s}
.qty button:hover{background:var(--line2)}
.qty .v{min-width:32px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.split3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.composer{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);height:min(560px,66vh)}
.composer .left{border-right:1px solid var(--line);overflow-y:auto;padding:16px;background:#fbfcfe}
.composer .right{overflow-y:auto;padding:16px;display:flex;flex-direction:column}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}

<script>
"use strict";
/* ============================================================
   Elixir Books — Web
   Desktop counterpart of the Elixir Books Lite mobile app.
   Single-file, no build step, no backend. Demo data only.

/* ---------- business ---------- */
const BIZ = { name:'Sri Lakshmi Traders', gstin:'29ABCDE1234F1Z5',
  addr:'14 Avenue Rd, Bengaluru 560002', state:'Karnataka', stateCode:29,
  prefix:'SLT/INV/2026-27/', bank:'HDFC ••4821', type:'Goods' };
const USER = { name:'Rajesh', role:'Owner · Admin', email:'rajesh@srilakshmi.in', phone:'+91 98450 12345' };

let customers = [
  { id:'c1', name:'Kumar Enterprises',    phone:'98450 11223', gstin:'29AABCK1234M1Z2', stateCode:29, state:'Karnataka',  type:'B2B', kw:['kumar'] },
  { id:'c2', name:'Anand Retail',         phone:'99620 44556', gstin:'33AAECA5678N1Z8', stateCode:33, state:'Tamil Nadu', type:'B2B', kw:['anand'] },
  { id:'c3', name:'Priya General Stores', phone:'90080 77332', gstin:'',                 stateCode:29, state:'Karnataka',  type:'B2C', kw:['priya'] },
  { id:'c4', name:'Vijay Wholesale',      phone:'94900 65432', gstin:'36AADCV2211P1Z6', stateCode:36, state:'Telangana',  type:'B2B', kw:['vijay'] },
  { id:'c5', name:'Meena Distributors',   phone:'99450 88771', gstin:'29AAJCM8090K1Z1', stateCode:29, state:'Karnataka',  type:'B2B', kw:['meena'] },
];
let items = [
  { id:'i1', name:'Basmati Rice 25kg Bag',   hsn:'1006', gst:5,  rate:1850, unit:'BAG',  kw:['rice','basmati'] },
  { id:'i2', name:'Sunflower Oil 5L',        hsn:'1512', gst:5,  rate:720,  unit:'CAN',  kw:['oil','sunflower'] },
  { id:'i3', name:'Wheat Flour 10kg',        hsn:'1101', gst:5,  rate:420,  unit:'BAG',  kw:['flour','wheat','atta'] },
  { id:'i4', name:'Detergent Powder 1kg',    hsn:'3402', gst:18, rate:145,  unit:'PKT',  kw:['detergent'] },
  { id:'i5', name:'Toilet Soap (pack of 4)', hsn:'3401', gst:18, rate:180,  unit:'PACK', kw:['soap'] },
  { id:'i6', name:'Notebook 200 pages',      hsn:'4820', gst:12, rate:55,   unit:'PC',   kw:['notebook','book'] },
  { id:'i7', name:'Steel Water Bottle 1L',   hsn:'7323', gst:18, rate:320,  unit:'PC',   kw:['bottle','steel'] },
  { id:'i8', name:'Sugar 50kg Bag',          hsn:'1701', gst:5,  rate:2400, unit:'BAG',  kw:['sugar'] },
  { id:'i9', name:'Tea Powder 1kg',          hsn:'0902', gst:5,  rate:480,  unit:'PKT',  kw:['tea'] },
];

/* ---------- helpers ---------- */
const cust = id => customers.find(c => c.id === id);
const item = id => items.find(i => i.id === id);

function fmt(n){
  const neg = n < 0; n = Math.abs(Math.round(n*100)/100);
  let [i,d] = n.toFixed(2).split('.');
  let last3 = i.slice(-3), other = i.slice(0,-3);
  if (other) last3 = ',' + last3;
  other = other.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
  return (neg?'-':'') + '₹' + other + last3 + '.' + d;
}
const fmt0 = n => fmt(n).replace(/\.\d\d$/,'');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* GST-correct totals: intra-state splits CGST+SGST, inter-state charges IGST */
function build(customerId, lineRefs){
  const c = cust(customerId);
  const inter = c.stateCode !== BIZ.stateCode;
  const lines = lineRefs.map(r => {
    const it = item(r.itemId), taxable = it.rate * r.qty;
    return { itemId:it.id, name:it.name, hsn:it.hsn, unit:it.unit, qty:r.qty,
             rate:it.rate, gst:it.gst, taxable, tax: taxable*it.gst/100 };
  });
  return totalise({ customerId, customerName:c.name, inter, lines });
}
function totalise(d){
  d.lines.forEach(l => { l.taxable = l.rate*l.qty; l.tax = l.taxable*l.gst/100; });
  d.sub = d.lines.reduce((a,l)=>a+l.taxable, 0);
  d.taxTotal = d.lines.reduce((a,l)=>a+l.tax, 0);
  const raw = d.sub + d.taxTotal;
  d.total = Math.round(raw); d.round = d.total - raw;
  d.cgst = d.inter ? 0 : d.taxTotal/2;
  d.sgst = d.inter ? 0 : d.taxTotal/2;
  d.igst = d.inter ? d.taxTotal : 0;
  return d;
}
function fakeIrn(seed){
  let h = 2166136261;
  for (let i=0;i<seed.length;i++){ h ^= seed.charCodeAt(i); h = Math.imul(h,16777619)>>>0; }
  let s = ''; const hex = '0123456789abcdef';
  for (let i=0;i<64;i++){ h = (Math.imul(h,1103515245)+12345)>>>0; s += hex[(h>>>(i%24))&15]; }
  return s;
}
function makeQR(seed){
  const n=25, cell=4, pad=8, size=n*cell+pad*2;
  let h=2166136261;
  for(let i=0;i<seed.length;i++){ h^=seed.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  const rnd=()=>{ h=(Math.imul(h,1103515245)+12345)>>>0; return (h>>>16)/65536; };
  const rect=(x,y)=>'<rect x="'+(pad+x*cell)+'" y="'+(pad+y*cell)+'" width="'+cell+'" height="'+cell+'"/>';
  let cells='';
  const finder=(ox,oy)=>{ for(let y=0;y<7;y++) for(let x=0;x<7;x++){
    const b=(x===0||x===6||y===0||y===6), inr=(x>=2&&x<=4&&y>=2&&y<=4);
    if(b||inr) cells+=rect(ox+x,oy+y); } };
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    if((x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8)) continue;
    if(rnd()>0.52) cells+=rect(x,y);
  }
  finder(0,0); finder(n-7,0); finder(0,n-7);
  return 'data:image/svg+xml,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<rect width="'+size+'" height="'+size+'" fill="#fff"/><g fill="#0f1b2d">'+cells+'</g></svg>');
}
const AVPAL = [['#eef4fb','#1c5fa8'],['#e7f5ef','#0a8f5f'],['#fdf3e3','#a86400'],['#f0eafb','#7a3fd0'],['#fbeef2','#c0398b']];

/* ---------- render scheduling + focus preservation ---------- */
let raf = null;
let onScreen = new Set();   // data-anim keys visible in the previous frame
function render(){
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = null;
    const root = document.getElementById('root');
    const a = document.activeElement;
    const key = a && a.dataset ? a.dataset.k : null;
    const ss = a && a.selectionStart, se = a && a.selectionEnd;

    /* remember where every scroll container was */
    const tops = {};
    root.querySelectorAll('[data-scroll]').forEach(n => { tops[n.dataset.scroll] = n.scrollTop; });

    root.innerHTML = view();

    /* entry animations run once, for panels that were not there a frame ago,
       instead of replaying on every keystroke */
    const now = new Set();
    root.querySelectorAll('[data-anim]').forEach(n => {
      const k = n.dataset.anim;
      now.add(k);
      if (!onScreen.has(k)) n.classList.add('is-new');
    });
    onScreen = now;

    root.querySelectorAll('[data-scroll]').forEach(n => {
      const t = tops[n.dataset.scroll];
      if (t) n.scrollTop = t;
    });

    if (key){
      const n = root.querySelector('[data-k="'+key+'"]');
      if (n){ n.focus(); try { n.setSelectionRange(ss, se); } catch(e){} }
    }
    const lb = document.getElementById('lx-body');
    if (lb) lb.scrollTop = lb.scrollHeight;
  });
}

function genEinvoice(no, silent){
  const inv = findInv(no); if (!inv || inv.eiStatus === 'GENERATED') return null;
  inv.eiStatus = 'GENERATED';
  inv.irn = fakeIrn(no);
  inv.ackNo = '1124' + Math.floor(100000 + Math.random()*899999);
  inv.ackDate = '23 Jul 2026';
  if (!silent) toast('E-invoice generated — IRN received');
  return inv;
}
function bulkEinvoice(){
  const eligible = [...S.selected].map(findInv).filter(i => i && i.eiStatus === 'PENDING');

  eligible.forEach(i => genEinvoice(i.no, true));

  setTimeout(() => { a.busy = false; a.step = 2; a.otp = ''; render(); focusAuth('otp'); }, 550);

  const a = S.auth;
  if (a.otp.length < 4) return authErr('Enter the 4-digit code');

  setTimeout(() => { a.busy = false; a.step = 3; render(); focusAuth('agst'); }, 550);

  const a = S.auth;
  if (a.gstin.length !== 15) return authErr('A GSTIN is 15 characters');
  a.err = ''; a.busy = true; render();
  setTimeout(() => { a.busy = false; a.fetched = true; render(); }, 700);

function authAdvance(){
  const a = S.auth;
  if (a.busy) return;
  if (a.step === 1) return sendOtp();
  if (a.step === 2) return verifyOtp();
  if (a.step === 3) return a.fetched ? (a.step = 4, a.err = '', render()) : fetchGstin();
  if (a.step === 4) return finishAuth();

function bootChat(){
  if (S.chatBooted) return;
  S.chatBooted = true;
  S.chat = [{ id:1, role:'bot', kind:'text',
    text:'Hi ' + USER.name + '. Tell me who to bill and what goes on it — for example “Invoice Kumar Enterprises: 8 wheat flour, 6 tea powder”.' }];
}
const nextId = () => Date.now() + Math.floor(Math.random()*1000);
function push(msgs){ S.chat = S.chat.concat(msgs); render(); }
function matchItem(q){
  q = q.toLowerCase().trim();
  return items.find(it => it.kw.some(k => q.includes(k)))
      || items.find(it => q.includes(it.name.toLowerCase().split(' ')[0]));
}
function sendChat(){
  const text = (S.chatInput || '').trim();
  if (!text) return;
  push([{ id:nextId(), role:'user', kind:'user', text }]);
  S.chatInput = '';
  const tid = nextId();
  push([{ id:tid, role:'bot', kind:'typing' }]);
  setTimeout(() => {
    S.chat = S.chat.filter(m => m.id !== tid);
    parse(text);
  }, 620);
}
function parse(text){
  const lower = text.toLowerCase();
  const matches = customers.filter(c => c.kw.some(k => lower.includes(k)) || lower.includes(c.name.toLowerCase()));
  let part = text.includes(':') ? text.split(':').slice(1).join(':') : text;
  const lines = [];
  part.split(/,|\band\b|\+/i).forEach(seg => {
    let qty, q;
    const m = seg.match(/(\d+)\s*(?:x|nos\.?|pcs\.?|units?|bags?|pkts?|pieces?)?\s+([a-z][a-z0-9 ]*)/i);
    if (m){ qty = parseInt(m[1]); q = m[2]; }
    else {
      const m2 = seg.match(/([a-z][a-z0-9 ]*?)\s*(?:x|×)\s*(\d+)/i);
      if (m2){ q = m2[1]; qty = parseInt(m2[2]); }
    }
    if (!qty || !q) return;
    const it = matchItem(q);
    if (it) lines.push({ itemId: it.id, qty });
  });

  const pend = Object.assign({ customerId:null, lines:[] }, S.pending || {});
  if (matches.length === 1) pend.customerId = matches[0].id;
  if (lines.length) pend.lines = pend.lines.concat(lines);

  if (!pend.customerId && matches.length > 1){
    S.pending = pend;
    return push([
      { id:nextId(), role:'bot', kind:'text', text:'More than one customer matches. Which one?' },
      { id:nextId(), role:'bot', kind:'chips', chips: matches.map(c => ({ label:c.name, cid:c.id })) }]);
  }
  if (!pend.customerId){
    S.pending = pend;
    return push([
      { id:nextId(), role:'bot', kind:'text', text:'Who should I bill this to?' },
      { id:nextId(), role:'bot', kind:'chips', chips: customers.slice(0,4).map(c => ({ label:c.name, cid:c.id })) }]);
  }
  if (!pend.lines.length){
    S.pending = pend;
    return push([{ id:nextId(), role:'bot', kind:'text',
      text:'Billing ' + cust(pend.customerId).name + '. What goes on it? e.g. “10 rice bags, 5 sunflower oil”.' }]);
  }
  emitDraft(pend.customerId, pend.lines);
}
function chooseCustomer(cid){
  const pend = Object.assign({ customerId:null, lines:[] }, S.pending || {});
  pend.customerId = cid;
  if (pend.lines.length) return emitDraft(cid, pend.lines);
  S.pending = pend;
  push([{ id:nextId(), role:'bot', kind:'text', text:'Billing ' + cust(cid).name + '. Now the items.' }]);
}
function emitDraft(customerId, lineRefs){
  const d = build(customerId, lineRefs), c = cust(customerId);
  S.pending = null;
  const intro = c.stateCode !== BIZ.stateCode
    ? c.name + ' is registered in ' + c.state + ', so this is inter-state — IGST applies.'
    : 'Here is the draft with GST worked out.';
  push([{ id:nextId(), role:'bot', kind:'text', text:intro },
        { id:nextId(), role:'bot', kind:'draft', draft:d }]);
}
function updateDraft(msgId, fn){
  S.chat = S.chat.map(m => {
    if (m.id !== msgId || m.kind !== 'draft') return m;
    const d = Object.assign({}, m.draft, { lines: m.draft.lines.map(l => Object.assign({}, l)) });
    fn(d); totalise(d);
    return Object.assign({}, m, { draft:d });
  });
  render();
}
function draftInc(msgId, itemId, delta){
  updateDraft(msgId, d => { d.lines = d.lines.map(l => l.itemId === itemId ? Object.assign({}, l, { qty: Math.max(1, l.qty + delta) }) : l); });
}
function draftRemove(msgId, itemId){
  updateDraft(msgId, d => { if (d.lines.length > 1) d.lines = d.lines.filter(l => l.itemId !== itemId); });
}
function draftAdd(msgId, itemId){
  updateDraft(msgId, d => {
    const ex = d.lines.find(l => l.itemId === itemId);
    if (ex) d.lines = d.lines.map(l => l.itemId === itemId ? Object.assign({}, l, { qty:l.qty+1 }) : l);
    else { const it = item(itemId); d.lines = d.lines.concat([{ itemId:it.id, name:it.name, hsn:it.hsn, unit:it.unit, qty:1, rate:it.rate, gst:it.gst }]); }
  });
  closeModal();
}
function confirmDraft(msgId){
  const m = S.chat.find(x => x.id === msgId);
  if (!m || m.draft.locked) return;
  updateDraft(msgId, d => { d.locked = true; });
  const inv = issue(m.draft);
  push([
    { id:nextId(), role:'bot', kind:'issued', no:inv.no, total:fmt(inv.total), who:inv.customerName },
    { id:nextId(), role:'bot', kind:'actions', no:inv.no }
  ]);
  if (S.route !== 'invoices') go('invoices');
}
function genEinvChat(no){
  const tid = nextId();
  push([{ id:tid, role:'bot', kind:'typing' }]);
  setTimeout(() => {
    S.chat = S.chat.filter(m => m.id !== tid);
    const inv = genEinvoice(no, true);
    if (!inv) return render();
    push([
      { id:nextId(), role:'bot', kind:'text', text:'Filed with the IRP. The IRN and signed QR are on the invoice PDF.' },
      { id:nextId(), role:'bot', kind:'einv', no, qr:makeQR(no + inv.irn), irn:inv.irn, ackNo:inv.ackNo, ackDate:inv.ackDate }
    ]);
  }, 1100);
}
function startVoice(){
  S.listening = true; render();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const demo = ['Invoice for Anand Retail, 20 basmati rice and 10 sunflower oil',
                'Bill Meena Distributors 30 rice bags and 15 detergent powder',
                'Invoice Kumar Enterprises 12 notebooks and 6 tea powder'];
  const fallback = () => { S._vt = setTimeout(() => finishVoice(demo[Math.floor(Math.random()*demo.length)]), 1700); };
  if (SR){
    try {
      const r = new SR(); r.lang = 'en-IN'; r.interimResults = false; S._rec = r;
      let got = false;
      r.onresult = e => { got = true; finishVoice(e.results[0][0].transcript); };
      r.onerror = () => { if (!got && S.listening) fallback(); };
      r.onend   = () => { if (!got && S.listening) fallback(); };
      r.start();
      S._vt = setTimeout(() => { try { r.stop(); } catch(e){} }, 6000);
      return;
    } catch(e){}
  }
  fallback();
}
function finishVoice(t){
  clearTimeout(S._vt);
  S.listening = false; S.chatInput = t; render();
  setTimeout(sendChat, 260);
}
function stopVoice(){ clearTimeout(S._vt); try { S._rec && S._rec.stop(); } catch(e){} S.listening = false; render(); }

function createQuote(){

    date:'23 Jul', validTill:'07 Aug 2026', status:'sent', invNo:null });

}
function convertQuote(no){
  const q = quotes.find(x => x.no === no);
  if (!q || q.status === 'accepted') return;
  const inv = issue(q);
  q.status = 'accepted'; q.invNo = inv.no;
  go('invoices'); openDoc('invoice', inv.no);
  toast('Quotation converted to ' + inv.no.split('/').pop());
}
function issueCreditNote(){
  const r = S.ret, inv = findInv(r.invNo);
  if (!inv) return toast('Select the invoice being returned against');
  const lines = inv.lines.map((l, idx) => ({ l, q: r.lines[idx] || 0 })).filter(x => x.q > 0)
    .map(({l,q}) => ({ itemId:l.itemId, name:l.name, hsn:l.hsn, unit:l.unit, qty:q, rate:l.rate, gst:l.gst }));
  if (!lines.length) return toast('Set a return quantity on at least one line');
  const cn = totalise({ customerId:inv.customerId, customerName:inv.customerName, inter:inv.inter, lines });
  Object.assign(cn, { no:'SLT/CN/2026-27/' + String(seq.cn).padStart(6,'0'), date:'23 Jul',
    invNo:inv.no, reason:(r.reason || '').trim() || 'Goods returned', status:'issued' });
  seq.cn++;
  returns = [cn].concat(returns);
  S.ret = { invNo:null, lines:{}, reason:'' };
  closeModal(); go('creditnotes'); openDoc('cnote', cn.no);
  toast('Credit note ' + cn.no.split('/').pop() + ' issued');
}

function dashboard(){
  const sales = invoices.filter(i=>i.payStatus!=='cancelled').reduce((a,i)=>a+i.total,0) + 371400;
  const out = outstanding();
  const overdue = invoices.filter(i => i.payStatus === 'overdue');
  const pend = eiPending();
  const hr = new Date().getHours();
  const greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';

  const kpi = (k, lab, val, sub) =>
    `<div class="kpi" style="--k:${k}"><div class="lab">${lab}</div>
      <div class="val num">${val}</div><div class="sub">${sub}</div></div>`;

  /* receivables ageing */
  const buckets = [['Current',0,0],['1–30 days',0,0],['31–60 days',0,0],['60+ days',0,0]];
  openInvoices().forEach(i => {
    const a = i.age || 0;
    const b = a <= 0 ? 0 : a <= 30 ? 1 : a <= 60 ? 2 : 3;
    buckets[b][1] += i.total; buckets[b][2]++;
  });
  const maxA = Math.max(1, ...buckets.map(b => b[1]));
  const ACOL = ['#1c5fa8','#0a8f5f','#a86400','#c0392b'];

  /* GST collected by slab */
  const slabs = { 5:0, 12:0, 18:0 };
  invoices.filter(i=>i.payStatus!=='cancelled').forEach(i => i.lines.forEach(l => { if (slabs[l.gst] != null) slabs[l.gst] += l.tax; }));
  const maxS = Math.max(1, ...Object.values(slabs));
  const SCOL = { 5:'#1c5fa8', 12:'#7a3fd0', 18:'#0a8f5f' };

  /* work queue */
  const queue = [];
  pend.forEach(i => queue.push(i.eiStatus === 'ACTION_REQUIRED'
    ? { ic:'warn', bg:'#fbeceb', fg:'#c0392b', t:'E-invoice rejected — ' + i.no.split('/').pop(),
        s: i.eiError || 'The IRP would not accept this invoice.', btn:'Fix and retry', a:'openRecover', v:i.no }
    : { ic:'shield', bg:'#fdf3e3', fg:'#a86400', t:'E-invoice pending — ' + i.no.split('/').pop(),
        s: i.customerName + ' · ' + fmt(i.total), btn:'Generate', a:'genEinv', v:i.no }));
  ewbDue().forEach(i => queue.push({ ic:'truck', bg:'#fdf3e3', fg:'#a86400',
    t:'E-way bill due — ' + i.no.split('/').pop(),
    s:'Consignment above ₹50,000 · ' + i.customerName, btn:'Generate', a:'openEwb', v:i.no }));
  overdue.forEach(i => queue.push({ ic:'bell', bg:'#fbeceb', fg:'#c0392b',
    t:'Overdue ' + (i.age||0) + ' days — ' + i.no.split('/').pop(),
    s: i.customerName + ' · ' + fmt(i.total), btn:'Send reminder', a:'remind', v:i.no }));

  return `
  <div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px">
    <div><div class="eyebrow">${greet}, ${USER.name}</div>
    <div style="font-size:21px;font-weight:800;letter-spacing:-.025em;margin-top:3px">
      ${queue.length ? queue.length + ' thing' + (queue.length>1?'s':'') + ' need you today' : 'Everything is filed and clear'}</div></div>
    <div class="spacer"></div>
    <button class="btn btn-o" data-a="newQuote">${ic('quote',15)} New quotation</button>
    <button class="btn btn-o" data-a="newReturn">${ic('cnote',15)} Record a return</button>
  </div>

  <div class="kpis">
    ${kpi('#1c5fa8','Sales this year', fmt0(sales), `<span class="trend up">+12.4%</span> on last year`)}
    ${kpi('#a86400','Outstanding', fmt0(out), `${openInvoices().length} invoices unsettled`)}
    ${kpi('#c0392b','Overdue', fmt0(overdue.reduce((a,i)=>a+i.total,0)), `${overdue.length} past the due date`)}
    ${kpi('#0a8f5f','GST collected', fmt0(Object.values(slabs).reduce((a,b)=>a+b,0)), 'Output tax, this year')}
  </div>

  <div class="sec grid" style="grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start">
    <div class="card">
      <div class="card-head"><h3>What needs doing</h3>
        <span class="pill soft">${queue.length} open</span><div class="spacer"></div>
        <button class="btn btn-sm btn-ghost" data-a="go" data-v="einvoices">Compliance ${ic('chev',13)}</button></div>
      ${queue.length ? `<div class="queue">${queue.map(q => `
        <div class="qrow">
          <div class="qico" style="background:${q.bg};color:${q.fg}">${ic(q.ic,17)}</div>
          <div class="qmain"><div class="qttl">${esc(q.t)}</div><div class="qsub">${esc(q.s)}</div></div>
          <button class="btn btn-sm btn-o" data-a="${q.a}" data-v="${q.v}">${q.btn}</button>
        </div>`).join('')}</div>`
      : `<div class="empty"><div class="ttl">Nothing pending</div>
          <div class="msg">Every invoice has an IRN, no consignment is waiting on an e-way bill, and nothing is past due.</div></div>`}
    </div>

    <div style="display:grid;gap:14px">
      <div class="card">
        <div class="card-head"><h3>Receivables ageing</h3><div class="spacer"></div>
          <span class="pill soft">${fmt0(out)} total</span></div>
        <div class="card-body">
          ${buckets.map((b,i) => `<div class="barrow">
            <div class="barlab">${b[0]}</div>
            <div class="bartrack"><div class="barfill" style="width:${Math.max(b[1]?5:0, Math.round(b[1]/maxA*100))}%;background:${ACOL[i]}"></div></div>
            <div class="barval">${b[1] ? fmt0(b[1]) : '—'}</div></div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>GST by slab</h3><div class="spacer"></div>
          <button class="btn btn-sm btn-ghost" data-a="go" data-v="reports">Registers ${ic('chev',13)}</button></div>
        <div class="card-body">
          ${[5,12,18].map(r => `<div class="barrow">
            <div class="barlab">GST ${r}%</div>
            <div class="bartrack"><div class="barfill" style="width:${Math.max(slabs[r]?5:0, Math.round(slabs[r]/maxS*100))}%;background:${SCOL[r]}"></div></div>
            <div class="barval">${slabs[r] ? fmt0(slabs[r]) : '—'}</div></div>`).join('')}
        </div>
      </div>
    </div>
  </div>

  <div class="sec card">
    <div class="card-head"><h3>Recent invoices</h3><div class="spacer"></div>
      <button class="btn btn-sm btn-ghost" data-a="go" data-v="invoices">All invoices ${ic('chev',13)}</button></div>
    <div class="tablewrap">${invoiceTable(invoices.slice(0,5), { compact:true })}</div>
  </div>`;
}

/* ---------- invoice table (shared) ---------- */
function invoiceTable(list, o){
  o = o || {};
  if (!list.length) return `<div class="empty"><div class="ttl">No invoices here</div>
    <div class="msg">Nothing matches this filter yet. Clear it, or start a new invoice — Lixi can take it by dictation.</div>
    <button class="btn btn-p" data-a="newInvoice" style="margin:0 auto">${ic('plus',15)} New invoice</button></div>`;
  const sel = S.selected;
  const th = (key, label, cls) => {
    if (o.compact) return `<th class="${cls||''}">${label}</th>`;
    const on = S.sort.key === key;
    return `<th class="sortable ${cls||''} ${on?'act':''}" data-a="sort" data-v="${key}">${label}<span class="arw">${on ? (S.sort.dir==='asc'?'▲':'▼') : '▾'}</span></th>`;
  };
  return `<table class="tbl">
    <thead><tr>
      ${o.compact ? '' : `<th style="width:34px"><span class="checkbox ${sel.size&&sel.size===list.length?'on':''}" data-a="selAll">${sel.size&&sel.size===list.length?ic('check',11):''}</span></th>`}
      ${th('no','Invoice')}${th('customer','Customer')}${th('date','Date')}
      <th class="hide-sm">Place of supply</th>${th('total','Amount','r')}
      <th>Payment</th><th class="hide-sm">E-invoice</th><th class="hide-sm">E-way bill</th>
    </tr></thead>
    <tbody>${list.map(i => {
      const av = avatar(i.customerName), c = cust(i.customerId);
      return `<tr data-a="openInv" data-v="${i.no}" class="${sel.has(i.no)?'sel':''}">
        ${o.compact ? '' : `<td onclick="event.stopPropagation()"><span class="checkbox ${sel.has(i.no)?'on':''}" data-a="selOne" data-v="${i.no}">${sel.has(i.no)?ic('check',11):''}</span></td>`}
        <td><span class="docno">${i.no.split('/').pop()}</span></td>
        <td><div class="who"><span class="av" style="background:${av[0]};color:${av[1]}">${i.customerName[0]}</span>
          <span style="min-width:0"><span class="nm">${esc(i.customerName)}</span>
          <span class="sb mono">${c && c.gstin ? c.gstin : 'B2C'}</span></span></div></td>
        <td style="white-space:nowrap;color:var(--ink2)">${i.date}</td>
        <td class="hide-sm"><span class="pill" style="background:${i.inter?'#f0eafb':'#eef4fb'};color:${i.inter?'#7a3fd0':'#1c5fa8'}">${i.inter?'IGST':'CGST+SGST'}</span>
          <div style="font-size:11.5px;color:var(--muted2);margin-top:3px">${c?esc(c.state):''}</div></td>
        <td class="r"><span class="money">${fmt(i.total)}</span></td>
        <td>${pill(PAY, i.payStatus)}</td>
        <td class="hide-sm">${pill(EI, i.eiStatus)}</td>
        <td class="hide-sm">${pill(EWB, i.ewbStatus)}</td>
      </tr>`; }).join('')}</tbody></table>`;
}
function sortInvoices(list){
  const { key, dir } = S.sort, m = dir === 'asc' ? 1 : -1;
  const v = i => key === 'total' ? i.total
    : key === 'customer' ? i.customerName.toLowerCase()
    : key === 'date' ? -(i.age || 0)
    : i.no;
  return [...list].sort((a,b) => { const x = v(a), y = v(b); return x < y ? -m : x > y ? m : 0; });
}

/* ---------- invoices ---------- */
function invoicesPage(){
  const q = S.invQ.toLowerCase();
  const F = { all:()=>true,
    unpaid:i => i.payStatus === 'unpaid' || i.payStatus === 'partial',
    overdue:i => i.payStatus === 'overdue',
    einv:i => i.eiStatus === 'PENDING' || i.eiStatus === 'ACTION_REQUIRED',
    ewb:i => i.ewbStatus === 'RECOMMENDED' };
  const counts = { all:invoices.length, unpaid:invoices.filter(F.unpaid).length,
    overdue:invoices.filter(F.overdue).length, einv:eiPending().length, ewb:ewbDue().length };
  let list = invoices.filter(F[S.invFilter] || F.all);
  if (q) list = list.filter(i => i.customerName.toLowerCase().includes(q) || i.no.toLowerCase().includes(q));
  list = sortInvoices(list);
  const shown = list.reduce((a,i)=>a+i.total,0);
  const chips = [['all','All'],['unpaid','Unpaid'],['overdue','Overdue'],['einv','E-invoice due'],['ewb','E-way bill due']];

  return `
  <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px">
    <div class="srch">${ic('search',16)}<input data-k="invq" data-i="invQ" value="${esc(S.invQ)}" placeholder="Search by customer or number" aria-label="Search invoices"></div>

      ${chips.map(([k,l]) => `<button class="chip ${S.invFilter===k?'on':''}" data-a="invFilter" data-v="${k}">${l}<span class="n">${counts[k]}</span></button>`).join('')}
    </div>
    <div class="spacer"></div>
    <button class="btn btn-o btn-sm" data-a="export">${ic('dl',15)} Export</button>
    <button class="btn btn-p btn-sm" data-a="newInvoice">${ic('plus',15)} New invoice</button>
  </div>
  <div class="card">
    ${S.selected.size ? `<div class="bulkbar">
      <span class="checkbox on">${ic('check',11)}</span>
      <span>${S.selected.size} selected · ${fmt(([...S.selected].map(findInv).filter(Boolean)).reduce((a,i)=>a+i.total,0))}</span>
      <div class="spacer"></div>
      <button class="btn btn-sm btn-p" data-a="bulkEinv">Generate e-invoices</button>
      <button class="btn btn-sm btn-o" data-a="export">Export selection</button>
      <button class="btn btn-sm btn-ghost" data-a="selNone">Clear</button></div>` : ''}
    <div class="tablewrap">${invoiceTable(list)}</div>
    ${list.length ? `<div style="display:flex;align-items:center;padding:11px 15px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--muted)">
      Showing ${list.length} of ${invoices.length} invoices<div class="spacer"></div>
      <span style="font-weight:700;color:var(--ink2)">Total <span class="money">${fmt(shown)}</span></span></div>` : ''}
  </div>`;
}

      <tbody>${b2b.map(i => { const av = avatar(i.customerName);

          <td><span class="pill" style="background:${r>=18?'#e7f5ef':r>=12?'#f0eafb':'#eef4fb'};color:${r>=18?'#0a8f5f':r>=12?'#7a3fd0':'#1c5fa8'}">GST ${r}%</span></td>

        </tbody></table></div>
      <div style="display:flex;padding:12px 15px;border-top:1px solid var(--line);font-weight:800">

function docTotals(d){
  return `<div class="totals">

    ${d.inter ? `<div class="trow"><span>IGST</span><span class="money">${fmt(d.igst)}</span></div>`

function drawer(){
  const k = S.drawer.kind;
  if (k === 'invoice') return invoiceDrawer(findInv(S.drawer.id));
  if (k === 'quote')   return simpleDocDrawer(quotes.find(q => q.no === S.drawer.id), 'quote');
  if (k === 'cnote')   return simpleDocDrawer(returns.find(r => r.no === S.drawer.id), 'cnote');
  return '';
}
function invoiceDrawer(inv){
  if (!inv) return '';
  const c = cust(inv.customerId), av = avatar(inv.customerName);
  const tl = [{ t:'Invoice issued', s: inv.date + ' 2026 · 10:24', c:'#1c5fa8' }];
  if (inv.eiStatus === 'GENERATED') tl.unshift({ t:'E-invoice generated · IRN received', s:(inv.ackDate||inv.date) + ' · 10:25', c:'#0a8f5f' });
  if (inv.eiStatus === 'ACTION_REQUIRED') tl.unshift({ t:'E-invoice rejected by the IRP', s: inv.date + ' · 10:25', c:'#c0392b' });
  if (inv.ewbStatus === 'ACTIVE') tl.unshift({ t:'E-way bill generated', s: inv.date + ' · 10:30', c:'#0a8f5f' });
  if (inv.payStatus === 'paid') tl.unshift({ t:'Payment received in full', s: inv.date + ' · 14:10', c:'#0a8f5f' });
  if (inv.payStatus === 'cancelled') tl.unshift({ t:'Invoice cancelled', s:'23 Jul · 15:02', c:'#c0392b' });

  return `<aside class="drawer" data-anim="drawer:${inv.no}" role="dialog" aria-label="Invoice ${inv.no}">
    <div class="dr-head">
      <div style="flex:1;min-width:0">
        <div class="eyebrow">Tax invoice</div>
        <div class="dr-title mono">${inv.no}</div>
        <div style="display:flex;gap:6px;margin-top:7px;flex-wrap:wrap">
          ${pill(PAY, inv.payStatus)}${pill(EI, inv.eiStatus)}
          ${inv.ewbStatus !== 'NOT_REQUIRED' ? pill(EWB, inv.ewbStatus) : ''}</div>
      </div>
      <button class="iconbtn" data-a="closeDrawer" aria-label="Close">${ic('x',18)}</button>
    </div>
    <div class="dr-body" data-scroll="drawer:${S.drawer&&S.drawer.id}">
      <div class="paper">
        <div class="paper-head">
          <div><div class="pl">Billed to</div>
            <div style="display:flex;align-items:center;gap:10px;margin-top:5px">
              <span class="av" style="background:${av[0]};color:${av[1]}">${inv.customerName[0]}</span>
              <span><span class="pv" style="display:block">${esc(inv.customerName)}</span>
              <span class="mono" style="font-size:11.5px;color:var(--muted)">${c && c.gstin ? c.gstin : 'Unregistered · B2C'}</span></span></div></div>
          <div style="text-align:right">
            <div class="pl">Place of supply</div>
            <div class="pv">${c ? esc(c.state) : '—'} <span style="color:var(--muted2)">(${c?c.stateCode:''})</span></div>
            <div style="margin-top:8px"><span class="pill" style="background:${inv.inter?'#f0eafb':'#eef4fb'};color:${inv.inter?'#7a3fd0':'#1c5fa8'}">
              ${inv.inter ? 'Inter-state · IGST' : 'Intra-state · CGST + SGST'}</span></div></div>
        </div>
        ${docLines(inv)}
        ${docTotals(inv)}
      </div>

      ${inv.eiStatus === 'GENERATED' ? `<div class="card" style="margin-top:14px">
        <div class="card-head"><h3>E-invoice</h3>${pill(EI,'GENERATED')}<div class="spacer"></div>
          <button class="btn btn-sm btn-o" data-a="openEiCancel" data-v="${inv.no}">Cancel IRN</button></div>
        <div class="card-body" style="display:flex;gap:16px;align-items:flex-start">
          <img src="${makeQR(inv.no + inv.irn)}" alt="Signed QR code" style="width:104px;height:104px;border:1px solid var(--line);border-radius:9px;flex:none">
          <div style="min-width:0;flex:1">
            <div class="pl">IRN</div><div class="irn" style="margin-bottom:9px">${inv.irn}</div>
            <div style="display:flex;gap:24px"><div><div class="pl">Ack no.</div><div class="mono" style="font-size:12.5px;font-weight:600">${inv.ackNo}</div></div>
            <div><div class="pl">Ack date</div><div style="font-size:12.5px;font-weight:600">${inv.ackDate}</div></div></div>
          </div></div></div>` : ''}

      ${inv.eiStatus === 'ACTION_REQUIRED' ? `<div class="card" style="margin-top:14px;border-color:#f0c9c4;background:#fffafa">
        <div class="card-body" style="display:flex;gap:13px;align-items:flex-start">
          <div class="qico" style="background:var(--redbg);color:var(--red)">${ic('warn',17)}</div>
          <div style="flex:1"><div style="font-weight:800;margin-bottom:3px">The IRP rejected this invoice</div>
            <div style="font-size:13px;color:var(--muted);margin-bottom:11px">${esc(inv.eiError || 'The portal would not accept the details sent.')}</div>
            <button class="btn btn-sm btn-p" data-a="openRecover" data-v="${inv.no}">Fix the GSTIN and retry</button></div></div></div>` : ''}

      ${inv.eiStatus === 'PENDING' ? `<div class="card" style="margin-top:14px;border-color:#f0dcb4;background:#fffdf7">

      ${inv.payStatus !== 'cancelled' ? `<button class="btn btn-d" data-a="openCancel" data-v="${inv.no}">Cancel invoice</button>` : ''}

}

              <span><span class="pv" style="display:block">${esc(d.customerName)}</span>

            ${!isQ ? `<div style="margin-top:8px"><div class="pl">Reason</div><div class="pv" style="font-size:13px">${esc(d.reason)}</div></div>` : ''}</div>

        <div class="qico" style="background:var(--greenbg);color:var(--green)">${ic('check',16)}</div>
        <div style="flex:1"><div style="font-weight:700">Accepted and converted</div>
          <div style="font-size:12.5px;color:var(--muted)">Invoice <span class="mono">${d.invNo.split('/').pop()}</span> was raised from this quotation.</div></div>

      <button class="btn btn-p" data-a="openShare" data-v="${d.no}">${ic('send',15)} Share</button>
      <button class="btn btn-o" data-a="export">${ic('dl',15)} PDF</button>
      <div class="spacer"></div>
      ${isQ && d.status !== 'accepted' ? `<button class="btn btn-g" data-a="convertQuote" data-v="${d.no}">Convert to invoice</button>` : ''}
    </div>
  </aside>`;
}

/* ---------- modals ---------- */
function mShell(title, sub, body, foot, cls){
  return `<div class="modal ${cls||''}" data-anim="modal:${S.modal?S.modal.kind:''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="md-head"><div style="flex:1">
      <div class="dr-title">${esc(title)}</div>
      ${sub ? `<div style="font-size:12.5px;color:var(--muted);margin-top:2px">${sub}</div>` : ''}</div>
      <button class="iconbtn" data-a="closeModal" aria-label="Close">${ic('x',18)}</button></div>
    ${body}${foot || ''}</div>`;
}
function composer(f, kind){
  const accent = kind === 'quote' ? 'var(--green)' : 'var(--navy)';
  const q = (f.q || '').toLowerCase();
  const cat = items.filter(it => !q || it.name.toLowerCase().includes(q) || it.hsn.includes(q));
  const d = (f.customerId && f.lines.length) ? build(f.customerId, f.lines) : null;
  const c = f.customerId ? cust(f.customerId) : null;
  return `<div class="md-body" data-scroll="modal:${S.modal?S.modal.kind:''}" style="padding:0"><div class="composer">
    <div class="left">
      <div class="field"><label>Bill to</label>
        <div class="picker">${customers.map(x => `<button class="pickrow ${f.customerId===x.id?'on':''}" data-a="pickCust" data-v="${x.id}" data-kind="${kind}">
          <span class="radio ${f.customerId===x.id?'on':''}"><i></i></span>
          <span style="flex:1;min-width:0"><span class="nm">${esc(x.name)}</span>
          <span class="sb mono">${x.gstin || 'B2C · ' + x.phone}</span></span>
          ${x.stateCode!==BIZ.stateCode?'<span class="pill" style="background:#f0eafb;color:#7a3fd0">IGST</span>':''}</button>`).join('')}</div>
        ${c ? `<div class="hint">${esc(c.state)} · ${c.stateCode !== BIZ.stateCode
          ? 'inter-state, so IGST is charged' : 'same state, so CGST and SGST are split'}</div>` : ''}
      </div>
      <div class="field" style="margin-bottom:0"><label>Add items</label>
        <input class="inp" data-k="catq" data-i="${kind}Q" value="${esc(f.q||'')}" placeholder="Filter the catalogue" style="margin-bottom:9px">
        <div class="catgrid">${cat.map(it => `<button class="catbtn" data-a="addLine" data-v="${it.id}" data-kind="${kind}">
          <div class="n">${esc(it.name)}</div><div class="m">${fmt(it.rate)} · ${it.gst}%</div></button>`).join('')}</div>
        ${!cat.length ? '<div class="hint">Nothing matches. Add it from the Items page first.</div>' : ''}
      </div>
    </div>
    <div class="right">
      ${f.lines.length ? `
        <table class="tbl" style="margin:-4px 0 0">
          <thead><tr><th>Item</th><th class="c">Qty</th><th class="r">Rate</th><th class="r">GST</th><th class="r">Amount</th><th style="width:32px"></th></tr></thead>
          <tbody>${f.lines.map(l => { const it = item(l.itemId);
            return `<tr style="cursor:default">
              <td><div style="font-weight:600;font-size:13px">${esc(it.name)}</div>
                <div class="mono" style="font-size:11px;color:var(--muted2)">HSN ${it.hsn}</div></td>
              <td class="c"><span class="qty">
                <button data-a="incLine" data-v="${it.id}" data-d="-1" data-kind="${kind}" aria-label="Reduce">−</button>
                <span class="v">${l.qty}</span>
                <button data-a="incLine" data-v="${it.id}" data-d="1" data-kind="${kind}" aria-label="Increase">+</button></span></td>
              <td class="r money" style="font-weight:500">${fmt(it.rate)}</td>
              <td class="r"><span class="pill soft">${it.gst}%</span></td>
              <td class="r money">${fmt(it.rate*l.qty)}</td>
              <td class="c"><button class="iconbtn" style="width:26px;height:26px" data-a="rmLine" data-v="${it.id}" data-kind="${kind}" aria-label="Remove">${ic('x',14)}</button></td>
            </tr>`; }).join('')}</tbody></table>
        <div class="spacer"></div>
        <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:13px">
          <div class="trow"><span>Taxable value</span><span class="money">${fmt(d.sub)}</span></div>
          ${d.inter ? `<div class="trow"><span>IGST</span><span class="money">${fmt(d.igst)}</span></div>`
            : `<div class="trow"><span>CGST</span><span class="money">${fmt(d.cgst)}</span></div>
               <div class="trow"><span>SGST</span><span class="money">${fmt(d.sgst)}</span></div>`}
          ${d.round ? `<div class="trow"><span>Rounding</span><span class="money">${fmt(d.round)}</span></div>` : ''}
          <div class="trow grand"><span>Total</span><span class="money" style="color:${accent}">${fmt(d.total)}</span></div>
        </div>`
      : `<div class="empty" style="margin:auto"><div class="ttl">Nothing on it yet</div>
          <div class="msg">Pick who you are billing, then tap items from the catalogue. GST is worked out from their state code as you go.</div></div>`}
    </div></div></div>`;
}
function modal(){
  const m = S.modal;

  if (m.kind === 'newInvoice'){
    const ready = S.form.customerId && S.form.lines.length;
    return mShell('New invoice', 'GST is derived from the customer’s state — you never pick the heads yourself',
      composer(S.form, 'form'),
      `<div class="md-foot"><span style="font-size:12.5px;color:var(--muted)">
        ${ready ? 'Issuing locks this document for GST.' : 'Pick a customer and at least one item.'}</span>
        <div class="spacer"></div>
        <button class="btn btn-o" data-a="closeModal">Cancel</button>
        <button class="btn btn-g" data-a="issueInvoice" ${ready?'':'disabled'}>Issue invoice</button></div>`);
  }
  if (m.kind === 'newQuote'){
    const ready = S.qForm.customerId && S.qForm.lines.length;
    return mShell('New quotation', 'Valid for 15 days · converts to a tax invoice in one click',
      composer(S.qForm, 'quote'),
      `<div class="md-foot"><div class="spacer"></div>

        ${inv ? `<div class="field"><label>How much came back</label>
          <table class="tbl" style="border:1px solid var(--line);border-radius:11px;overflow:hidden">
            <thead><tr><th>Item</th><th class="c">Returned</th><th class="r">Rate</th><th class="r">Credit</th></tr></thead>
            <tbody>${inv.lines.map((l,i) => { const q = S.ret.lines[i] || 0;
              return `<tr style="cursor:default"><td><div style="font-weight:600;font-size:13px">${esc(l.name)}</div>
                <div style="font-size:11px;color:var(--muted2)">billed ${l.qty} ${l.unit}</div></td>
                <td class="c"><span class="qty">
                  <button data-a="incRet" data-v="${i}" data-d="-1">−</button><span class="v">${q}</span>
                  <button data-a="incRet" data-v="${i}" data-d="1">+</button></span></td>
                <td class="r money" style="font-weight:500">${fmt(l.rate)}</td>
                <td class="r money" style="color:${q?'var(--magenta)':'var(--muted2)'}">${q?fmt(l.rate*q):'—'}</td></tr>`; }).join('')}
            </tbody></table></div>
          <div class="field"><label>Reason</label>
            <input class="inp" data-k="retr" data-i="ret.reason" value="${esc(S.ret.reason)}" placeholder="Damaged in transit, wrong item, short supply…"></div>
          <div style="background:#fbfcfe;border:1px solid var(--line);border-radius:11px;padding:13px">
            <div class="trow"><span>Taxable value</span><span class="money">${fmt(sub)}</span></div>
            <div class="trow"><span>${inv.inter?'IGST':'CGST + SGST'}</span><span class="money">${fmt(tax)}</span></div>
            <div class="trow grand"><span>Credit note total</span><span class="money" style="color:var(--magenta)">${fmt(Math.round(sub+tax))}</span></div></div>`
        : `<div class="hint">Pick the invoice first and its lines will appear here.</div>`}

      `<div class="md-foot"><div class="spacer"></div>

      'md');
  }
  if (m.kind === 'addCustomer'){
    const a = S.newCust;
    return mShell('Add customer', 'A GSTIN makes them B2B and turns on e-invoicing',
      `<div class="md-body" data-scroll="modal:${S.modal?S.modal.kind:''}">
        <div class="field"><label>Name</label><input class="inp" data-k="acn" data-i="newCust.name" value="${esc(a.name)}" placeholder="Business or person"></div>
        <div class="split">
          <div class="field"><label>Phone</label><input class="inp" data-k="acp" data-i="newCust.phone" value="${esc(a.phone)}" placeholder="98450 12345"></div>

            <input class="inp mono" data-k="acg" data-i="newCust.gstin" value="${esc(a.gstin)}" placeholder="29ABCDE1234F1Z5" maxlength="15"></div>
        </div>
        <div class="field" style="margin-bottom:0"><label>State</label>
          <div class="segs">${[[29,'Karnataka'],[33,'Tamil Nadu'],[36,'Telangana'],[27,'Maharashtra']].map(([c,l]) =>
            `<button class="seg ${a.stateCode===c?'on':''}" data-a="acState" data-v="${c}">${l}</button>`).join('')}</div>
          <div class="hint">${a.stateCode === BIZ.stateCode

        <button class="btn btn-p" data-a="saveCustomer">Add customer</button></div>`, 'sm');
  }
  if (m.kind === 'addItem'){

        <div class="field"><label>GST rate</label>
          <div class="segs">${[0,5,12,18,28].map(g => `<button class="seg ${a.gst===g?'on':''}" data-a="aiGst" data-v="${g}">${g}%</button>`).join('')}</div></div>
        <div class="field" style="margin-bottom:0"><label>Unit</label>
          <div class="segs">${['PC','BAG','PKT','CAN','PACK','KG'].map(u => `<button class="seg ${a.unit===u?'on':''}" data-a="aiUnit" data-v="${u}">${u}</button>`).join('')}</div></div>
      </div>`,
      `<div class="md-foot"><div class="spacer"></div>
        <button class="btn btn-o" data-a="closeModal">Cancel</button>
        <button class="btn btn-p" data-a="saveItem">Add item</button></div>`, 'sm');
  }
  if (m.kind === 'ewb'){
    const inv = findInv(m.no), e = S.ewb;

        <div style="background:var(--bluebg);border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--navy-d);line-height:1.55">

      `<div class="md-foot"><div class="spacer"></div>
        <button class="btn btn-o" data-a="closeModal">Cancel</button>

  if (m.kind === 'recover'){
    const inv = findInv(m.no), c = inv && cust(inv.customerId);
    return mShell('Fix and retry', inv ? inv.no.split('/').pop() + ' · ' + inv.customerName : '',
      `<div class="md-body" data-scroll="modal:${S.modal?S.modal.kind:''}">

        <div class="field"><label>Corrected GSTIN for ${esc(inv?inv.customerName:'')}</label>
          <input class="inp mono" data-k="rgs" data-i="recover.gstin" value="${esc(S.recover.gstin)}" placeholder="${c && c.gstin ? c.gstin : '29ABCDE1234F1Z5'}" maxlength="15">

      `<div class="md-foot"><div class="spacer"></div>
        <button class="btn btn-o" data-a="closeModal">Cancel</button>

  }
  if (m.kind === 'pay'){
    const inv = findInv(m.no);
    return mShell('Record payment', inv ? fmt(inv.total) + ' outstanding · ' + inv.customerName : '',
      `<div class="md-body" data-scroll="modal:${S.modal?S.modal.kind:''}" style="padding:12px"><div style="display:grid;gap:8px">
        <button class="pickrow" style="border:1px solid var(--line);border-radius:11px;background:var(--greenbg)" data-a="payFull" data-v="${m.no}">

          <span class="qico" style="background:var(--bluebg);color:var(--navy)">${ic('chart',17)}</span>
          <span style="flex:1"><span class="nm">Part payment received</span><span class="sb">Balance stays outstanding</span></span></button>
        <button class="pickrow" style="border:1px solid var(--line);border-radius:11px" data-a="remindWa" data-v="${m.no}">
          <span class="qico" style="background:#eafaf1;color:#25923f">${ic('wa',17)}</span>
          <span style="flex:1"><span class="nm">Send a reminder instead</span><span class="sb">On WhatsApp, with the payment link</span></span></button>
      </div></div>`, '', 'sm');
  }
  if (m.kind === 'cancel' || m.kind === 'eicancel' || m.kind === 'ewbcancel'){
    const cfg = {
      cancel:['Cancel invoice','This reverses the sale. The number stays used and shows as cancelled in your register.',
        ['Customer request','Wrong details','Duplicate invoice','Goods returned'],'cancelInv'],
      eicancel:['Cancel the IRN','The IRP allows cancellation within 24 hours of generation. After that, raise a credit note.',
        ['Data entry mistake','Duplicate','Order cancelled','Other'],'cancelEi'],
      ewbcancel:['Cancel the e-way bill','Only possible while the goods have not moved.',
        ['Duplicate','Order cancelled','Data entry mistake'],'cancelEwb'],
    }[m.kind];
    return mShell(cfg[0], cfg[1],
      `<div class="md-body" data-scroll="modal:${S.modal?S.modal.kind:''}" style="padding:12px"><div style="display:grid;gap:8px">
        ${cfg[2].map(r => `<button class="pickrow" style="border:1px solid #f3c9c4;border-radius:11px;color:var(--red);font-weight:700"
          data-a="${cfg[3]}" data-v="${m.no}" data-r="${esc(r)}">${r}</button>`).join('')}</div></div>`,
      `<div class="md-foot"><div class="spacer"></div><button class="btn btn-o" data-a="closeModal">Keep it</button></div>`, 'sm');
  }
  if (m.kind === 'custActions'){
    const c = customers.find(x => x.id === m.id);
    if (!c) return '';
    const av = avatar(c.name);
    const inv = invoices.filter(i => i.customerId === c.id);
    return mShell(c.name, (c.gstin || 'B2C') + ' · ' + c.state,
      `<div class="md-body" data-scroll="modal:${S.modal?S.modal.kind:''}" style="padding:12px">
        <div style="display:flex;gap:12px;padding:0 8px 14px">
          <span class="av" style="width:44px;height:44px;border-radius:13px;background:${av[0]};color:${av[1]};font-size:17px">${c.name[0]}</span>
          <div style="flex:1;font-size:13px;color:var(--ink2);line-height:1.6">
            <span class="mono">${esc(c.phone)}</span><br>
            ${inv.length} invoice${inv.length===1?'':'s'} · ${fmt0(inv.reduce((a,i)=>a+i.total,0))} billed</div></div>
        <div style="display:grid;gap:8px">
          <button class="pickrow" style="border:1px solid var(--line);border-radius:11px;background:var(--bluebg)" data-a="billCust" data-v="${c.id}">
            <span class="qico" style="background:#fff;color:var(--navy)">${ic('doc',17)}</span>
            <span style="flex:1"><span class="nm">New invoice</span><span class="sb">Opens the composer with them selected</span></span></button>
          <button class="pickrow" style="border:1px solid var(--line);border-radius:11px" data-a="lixiCust" data-v="${c.id}">
            <span class="qico" style="background:#e7f5ef;color:var(--green)">${ic('spark',17)}</span>
            <span style="flex:1"><span class="nm">Dictate to Lixi</span><span class="sb">Say the items and confirm the draft</span></span></button>
          <button class="pickrow" style="border:1px solid var(--line);border-radius:11px" data-a="soon">
            <span class="qico" style="background:#eafaf1;color:#25923f">${ic('wa',17)}</span>
            <span style="flex:1"><span class="nm">Message on WhatsApp</span><span class="sb">${esc(c.phone)}</span></span></button>
        </div></div>`, '', 'sm');
  }
  if (m.kind === 'draftadd'){
    return mShell('Add to the draft', 'Tap an item to put it on this invoice',
      `<div class="md-body" data-scroll="modal:${S.modal?S.modal.kind:''}" style="padding:12px"><div class="catgrid" style="grid-template-columns:1fr 1fr">
        ${items.map(it => `<button class="catbtn" data-a="draftAdd" data-v="${it.id}" data-m="${m.msgId}">
          <div class="n">${esc(it.name)}</div><div class="m">${fmt(it.rate)} · ${it.gst}%</div></button>`).join('')}
      </div></div>`, '', 'sm');
  }
  return '';
}
