/* ---------- command palette ---------- */
function palCommands(){
  const cmds = [];
  NAV.forEach(g => g.items.forEach(([r,l]) => cmds.push({ sec:'Go to', n:l, s:g.grp, a:'go', v:r })));
  cmds.push({ sec:'Create', n:'New invoice', s:'Issue a tax invoice', a:'newInvoice' });
  cmds.push({ sec:'Create', n:'New quotation', s:'Quote before you bill', a:'newQuote' });
  cmds.push({ sec:'Create', n:'Record a return', s:'Raise a credit note', a:'newReturn' });
  cmds.push({ sec:'Create', n:'Add customer', s:'With GSTIN and state', a:'addCustomer' });
  cmds.push({ sec:'Create', n:'Add item', s:'With HSN and GST rate', a:'addItem' });
  cmds.push({ sec:'Create', n:'Ask Lixi', s:'Dictate an invoice', a:'focusLixi' });
  cmds.push({ sec:'Account', n:'Sign out', s:'End this session', a:'logout' });
  invoices.slice(0,14).forEach(i => cmds.push({ sec:'Invoices', n:i.no.split('/').pop() + ' · ' + i.customerName,
    s: fmt(i.total) + ' · ' + PAY[i.payStatus][0], a:'openInv', v:i.no }));
  customers.forEach(c => cmds.push({ sec:'Customers', n:c.name, s:c.gstin || 'B2C · ' + c.phone, a:'custActions', v:c.id }));
  return cmds;
}
function palFiltered(){
  const q = S.palQ.toLowerCase().trim();
  const all = palCommands();
  if (!q) return all.filter(c => c.sec === 'Go to' || c.sec === 'Create');
  return all.filter(c => (c.n + ' ' + c.s).toLowerCase().includes(q)).slice(0, 20);
}
function palette(){
  const list = palFiltered();
  let last = '';
  return `<div class="palette" data-anim="palette" role="dialog" aria-label="Command palette">
    <div class="pal-in">${ic('search',18)}
      <input data-k="pal" data-i="palQ" value="${esc(S.palQ)}" placeholder="Search invoices, customers, or jump to a page" aria-label="Search">
      <span class="kbd">Esc</span></div>
    <div class="pal-list">${list.length ? list.map((c,i) => {
      const head = c.sec !== last ? `<div class="pal-sec">${c.sec}</div>` : '';
      last = c.sec;
      return head + `<button class="pal-row ${i===S.palIdx?'on':''}" data-a="palRun" data-v="${i}">
        <span class="n">${esc(c.n)}</span><span class="s">${esc(c.s)}</span>
        ${i===S.palIdx?'<span class="kbd">↵</span>':''}</button>`;
    }).join('') : `<div style="padding:26px;text-align:center;color:var(--muted);font-size:13.5px">
      Nothing matches “${esc(S.palQ)}”</div>`}</div></div>`;
}

/* ============================================================
   EVENTS
   ============================================================ */
function setPath(path, val){
  const parts = path.split('.');
  let o = S;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length-1]] = val;
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.i){
    let v = t.value;
    if (t.dataset.i === 'newCust.gstin' || t.dataset.i === 'recover.gstin' || t.dataset.i === 'ewb.vehicle'
      || t.dataset.i === 'auth.gstin') v = v.toUpperCase();
    if (t.dataset.i === 'auth.phone') v = v.replace(/\D/g,'').slice(0,10);
    if (t.dataset.i === 'auth.otp') v = v.replace(/\D/g,'').slice(0,4);
    if (t.dataset.i.indexOf('auth.') === 0){
      /* nothing on the sign-in screen is derived from these while typing,
         so update in place and skip the re-render entirely */
      setPath(t.dataset.i, v);
      if (t.value !== v){
        const caret = Math.max(0, t.selectionStart - (t.value.length - v.length));
        t.value = v;
        try { t.setSelectionRange(caret, caret); } catch(e){}
      }
      if (S.auth.err){ S.auth.err = ''; const n = document.querySelector('.auth-err'); if (n) n.remove(); }
      return;
    }
    if (t.dataset.i === 'ewb.distance') v = v.replace(/\D/g,'');
    setPath(t.dataset.i, v);
    if (t.dataset.i === 'palQ') S.palIdx = 0;
    if (t.id === 'lx-input'){ t.style.height = 'auto'; t.style.height = Math.min(110, t.scrollHeight) + 'px'; }
    render();
  }
});
document.addEventListener('keydown', e => {
  /* signed out: the form owns the keyboard */
  if (!S.auth.authed){
    if (e.key === 'Enter'){ e.preventDefault(); authAdvance(); }
    return;
  }
  /* global shortcuts */
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault(); S.palette = !S.palette; S.palQ = ''; S.palIdx = 0; render();
    setTimeout(() => { const n = document.querySelector('[data-k="pal"]'); n && n.focus(); }, 30);
    return;
  }
  if (S.palette){
    const list = palFiltered();
    if (e.key === 'Escape'){ e.preventDefault(); S.palette = false; render(); return; }
    if (e.key === 'ArrowDown'){ e.preventDefault(); S.palIdx = Math.min(list.length-1, S.palIdx+1); render(); return; }
    if (e.key === 'ArrowUp'){ e.preventDefault(); S.palIdx = Math.max(0, S.palIdx-1); render(); return; }
    if (e.key === 'Enter'){ e.preventDefault(); runPal(S.palIdx); return; }
    return;
  }
  if (e.key === 'Escape'){
    if (S.menu){ S.menu = false; render(); return; }
    if (S.modal) return closeModal();
    if (S.drawer) return closeDrawer();
  }
  if (e.target.id === 'lx-input' && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); return; }
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'n'){ e.preventDefault(); act('newInvoice'); }
  else if (e.key === 'l'){ e.preventDefault(); act('focusLixi'); }
  else if (e.key === '/'){ e.preventDefault(); S.palette = true; S.palQ = ''; S.palIdx = 0; render();
    setTimeout(() => { const n = document.querySelector('[data-k="pal"]'); n && n.focus(); }, 30); }
});
function runPal(i){
  const c = palFiltered()[i];
  if (!c) return;
  S.palette = false; S.palQ = '';
  act(c.a, c.v);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el){ if (S.menu){ S.menu = false; render(); } return; }
  if (S.menu && el.dataset.a !== 'toggleMenu') S.menu = false;
  const d = el.dataset;
  act(d.a, d.v, d);
});

function act(a, v, d){
  d = d || {};
  switch (a){
    /* account */
    case 'sendOtp': sendOtp(); break;
    case 'verifyOtp': verifyOtp(); break;
    case 'resendOtp': S.auth.otp = ''; render(); toast('Code sent again'); focusAuth('otp'); break;
    case 'authBack': S.auth.step = 1; S.auth.otp = ''; S.auth.err = ''; render(); focusAuth('aphone'); break;
    case 'gstinNext': S.auth.fetched ? (S.auth.step = 4, render()) : fetchGstin(); break;
    case 'skipAuth': skipAuth(); break;
    case 'finishAuth': finishAuth(); break;
    case 'toggleMenu': S.menu = !S.menu; render(); break;
    case 'logout': logout(); break;

    /* navigation */
    case 'go': go(v); break;
    case 'toggleRail': S.rail = !S.rail; render(); break;
    case 'toggleLixi': S.lixi = !S.lixi; render();
      if (S.lixi) setTimeout(() => { const n = document.getElementById('lx-input'); n && n.focus(); }, 240);
      break;
    case 'openPalette': S.palette = true; S.palQ = ''; S.palIdx = 0; render();
      setTimeout(() => { const n = document.querySelector('[data-k="pal"]'); n && n.focus(); }, 30); break;
    case 'closePalette': S.palette = false; render(); break;
    case 'palRun': runPal(parseInt(v)); break;
    case 'closeDrawer': closeDrawer(); break;
    case 'closeModal': closeModal(); break;

    /* create */
    case 'newInvoice': S.form = { customerId:null, lines:[], q:'' }; openModal({ kind:'newInvoice' }); break;
    case 'newQuote': S.qForm = { customerId:null, lines:[], q:'' }; openModal({ kind:'newQuote' }); break;
    case 'newReturn': S.ret = { invNo:null, lines:{}, reason:'' }; openModal({ kind:'newReturn' }); break;
    case 'addCustomer': openModal({ kind:'addCustomer' }); break;
    case 'addItem': openModal({ kind:'addItem' }); break;

    /* open documents */
    case 'openInv': closeModal(); openDoc('invoice', v); break;
    case 'openQuote': openDoc('quote', v); break;
    case 'openCnote': openDoc('cnote', v); break;
    case 'custActions': openModal({ kind:'custActions', id:v }); break;
    case 'quickBill': S.form = { customerId:null, lines:[{ itemId:v, qty:1 }], q:'' }; openModal({ kind:'newInvoice' }); break;
    case 'billCust': S.form = { customerId:v, lines:[], q:'' }; openModal({ kind:'newInvoice' }); break;
    case 'lixiCust': closeModal(); S.lixi = true; bootChat();
      S.chatInput = 'Invoice ' + cust(v).name + ': '; render();
      setTimeout(() => { const n = document.getElementById('lx-input'); if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 240);
      break;

    /* invoice list */
    case 'invFilter': S.invFilter = v; S.selected = new Set(); render(); break;
    case 'sort':
      if (S.sort.key === v) S.sort.dir = S.sort.dir === 'asc' ? 'desc' : 'asc';
      else S.sort = { key:v, dir:'desc' };
      render(); break;
    case 'selOne': S.selected.has(v) ? S.selected.delete(v) : S.selected.add(v); render(); break;
    case 'selNone': S.selected = new Set(); render(); break;
    case 'selAll': {
      const q = S.invQ.toLowerCase();
      const F = { all:()=>true, unpaid:i=>i.payStatus==='unpaid'||i.payStatus==='partial',
        overdue:i=>i.payStatus==='overdue', einv:i=>i.eiStatus==='PENDING'||i.eiStatus==='ACTION_REQUIRED',
        ewb:i=>i.ewbStatus==='RECOMMENDED' };
      let list = invoices.filter(F[S.invFilter] || F.all);
      if (q) list = list.filter(i => i.customerName.toLowerCase().includes(q) || i.no.toLowerCase().includes(q));
      S.selected = S.selected.size === list.length ? new Set() : new Set(list.map(i => i.no));
      render(); break; }
    case 'bulkEinv': bulkEinvoice(); render(); break;

    /* compliance */
    case 'genEinv': genEinvoice(v); render(); break;
    case 'fileAllEinv': {
      const p = eiPending().filter(i => i.eiStatus === 'PENDING');
      p.forEach(i => genEinvoice(i.no, true));
      toast(p.length + ' e-invoice' + (p.length===1?'':'s') + ' filed'); break; }
    case 'openRecover': closeDrawer(); S.recover = { gstin:'', busy:false, done:false }; openModal({ kind:'recover', no:v }); break;
    case 'retryEinv': retryEinvoice(); break;
    case 'openEwb': closeDrawer(); S.ewb = { transporter:'', vehicle:'', distance:'', mode:'Road' }; S.ewbErr = false; openModal({ kind:'ewb', no:v }); break;
    case 'ewbMode': S.ewb.mode = v; render(); break;
    case 'genEwb': generateEwb(); break;
    case 'extendEwb': extendEwb(v); render(); break;

    /* composer */
    case 'pickCust': {
      const f = d.kind === 'quote' ? S.qForm : S.form;
      f.customerId = v; render(); break; }
    case 'addLine': {
      const f = d.kind === 'quote' ? S.qForm : S.form;
      const ex = f.lines.find(l => l.itemId === v);
      if (ex) ex.qty++; else f.lines.push({ itemId:v, qty:1 });
      render(); break; }
    case 'incLine': {
      const f = d.kind === 'quote' ? S.qForm : S.form;
      f.lines = f.lines.map(l => l.itemId === v ? { itemId:v, qty:l.qty + parseInt(d.d) } : l).filter(l => l.qty > 0);
      render(); break; }
    case 'rmLine': {
      const f = d.kind === 'quote' ? S.qForm : S.form;
      f.lines = f.lines.filter(l => l.itemId !== v); render(); break; }
    case 'issueInvoice': {
      const f = S.form;
      if (!f.customerId || !f.lines.length) return toast('Pick a customer and add at least one item');
      const inv = issue(build(f.customerId, f.lines));
      S.form = { customerId:null, lines:[], q:'' };
      closeModal(); go('invoices'); openDoc('invoice', inv.no);
      toast('Invoice ' + inv.no.split('/').pop() + ' issued'); break; }
    case 'createQuote': createQuote(); break;
    case 'convertQuote': convertQuote(v); break;

    /* returns */
    case 'pickRetInv': {
      S.ret.invNo = v; S.ret.lines = {};
      findInv(v).lines.forEach((l,i) => S.ret.lines[i] = 0);
      render(); break; }
    case 'incRet': {
      const inv = findInv(S.ret.invNo); if (!inv) break;
      const i = parseInt(v), max = inv.lines[i].qty;
      S.ret.lines[i] = Math.max(0, Math.min(max, (S.ret.lines[i]||0) + parseInt(d.d)));
      render(); break; }
    case 'issueCn': issueCreditNote(); break;

    /* masters */
    case 'acState': S.newCust.stateCode = parseInt(v); render(); break;
    case 'saveCustomer': saveCustomer(); break;
    case 'aiGst': S.newItem.gst = parseInt(v); render(); break;
    case 'aiUnit': S.newItem.unit = v; render(); break;
    case 'saveItem': saveItem(); break;

    /* share / payment / cancel */
    case 'openShare': openModal({ kind:'share', no:v }); break;
    case 'shareDone': closeModal();
      toast(v === 'Copy link' ? 'Link copied' : v === 'Download PDF' ? 'PDF downloaded' : 'Sent on ' + v); break;
    case 'openPay': openModal({ kind:'pay', no:v }); break;
    case 'payFull': markPaid(v); render(); break;
    case 'payPartial': markPartial(v); render(); break;
    case 'remindWa': closeModal(); toast('Reminder sent on WhatsApp'); break;
    case 'remind': toast('Reminder sent on WhatsApp'); break;
    case 'openCancel': openModal({ kind:'cancel', no:v }); break;
    case 'cancelInv': cancelInvoice(v, d.r); closeDrawer(); render(); break;
    case 'openEiCancel': openModal({ kind:'eicancel', no:v }); break;
    case 'cancelEi': cancelEinvoice(v); render(); break;
    case 'openEwbCancel': openModal({ kind:'ewbcancel', no:v }); break;
    case 'cancelEwb': cancelEwb(v); render(); break;

    /* Lixi */
    case 'sendChat': sendChat(); break;
    case 'startVoice': startVoice(); break;
    case 'stopVoice': stopVoice(); break;
    case 'fill': S.chatInput = v; render(); setTimeout(sendChat, 60); break;
    case 'chooseCust': chooseCustomer(v); break;
    case 'draftInc': draftInc(parseInt(d.m), v, 1); break;
    case 'draftDec': draftInc(parseInt(d.m), v, -1); break;
    case 'draftRm': draftRemove(parseInt(d.m), v); break;
    case 'draftAddOpen': openModal({ kind:'draftadd', msgId:parseInt(d.m) }); break;
    case 'draftAdd': draftAdd(parseInt(d.m), v); break;
    case 'confirmDraft': confirmDraft(parseInt(d.m)); break;
    case 'genEinvChat': genEinvChat(v); break;
    case 'focusLixi': S.lixi = true; bootChat(); render();
      setTimeout(() => { const n = document.getElementById('lx-input'); n && n.focus(); }, 240); break;

    /* misc */
    case 'toggleInt': S.integrations[v] = !S.integrations[v]; render();
      toast(v + (S.integrations[v] ? ' connected' : ' turned off')); break;
    case 'export': toast('Exported'); break;
    case 'waSupport': toast('Opening WhatsApp support'); break;
    case 'soon': toast('Not in this demo'); break;
  }
}

/* ---------- boot ---------- */
render();
focusAuth('aphone');
</script>
</body>
</html>
